
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #otpSection {
      display: none;
      margin-top: 20px;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    .request-id {
      margin-top: 10px;
      padding: 8px;
      background: #f3f4f6;
      border-radius: 5px;
      font-size: 12px;
      word-break: break-all;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>OTP Verification</h1>

    <div class="subtitle">
      Enter your email to receive a verification code.
    </div>

    <!-- Email -->
    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="user@example.com"
      autocomplete="email"
    >

    <button id="sendButton" onclick="requestOTP()">
      Send OTP
    </button>


    <!-- OTP -->
    <div id="otpSection">

      <label for="otp">Enter OTP</label>

      <input
        type="text"
        id="otp"
        placeholder="123456"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
      >

      <button id="verifyButton" onclick="verifyOTP()">
        Verify OTP
      </button>

    </div>


    <!-- Status -->
    <div id="message"></div>

  </div>


<script>

  // =====================================================
  // CONFIGURATION
  // =====================================================

  const API_BASE =
    "https://otp.whitecloudglobalsolutions.in";

  const API_KEY =
    "a7e646347c46b245cbceb97605c7848ba8bc98a77e507130862ae20406ca5679";

  const PURPOSE =
    "registration";


  // Stores the request ID returned by the OTP API
  let requestId = null;


  // =====================================================
  // SHOW MESSAGE
  // =====================================================

  function showMessage(message, type) {

    const messageElement =
      document.getElementById("message");

    messageElement.textContent = message;

    messageElement.className = type;
  }


  // =====================================================
  // REQUEST OTP
  // =====================================================

  async function requestOTP() {

    const email =
      document.getElementById("email").value.trim();

    const sendButton =
      document.getElementById("sendButton");


    // Check email
    if (!email) {

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return;
    }


    sendButton.disabled = true;
    sendButton.textContent = "Sending...";


    try {

      const response = await fetch(
        API_BASE + "/auth/otp/request",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "X-API-Key": API_KEY
          },

          body: JSON.stringify({
            identifier: email,
            purpose: PURPOSE
          })
        }
      );


      const data = await response.json();


      if (data.success) {

        // Save request ID for verification
        requestId = data.request_id;


        document.getElementById("otpSection")
          .style.display = "block";


        showMessage(
          "OTP sent successfully. Check your email.",
          "success"
        );


      } else {

        showMessage(
          data.message || "Failed to send OTP.",
          "error"
        );

      }


    } catch (error) {

      console.error(error);

      showMessage(
        "Unable to connect to the OTP server.",
        "error"
      );

    } finally {

      sendButton.disabled = false;
      sendButton.textContent = "Send OTP";

    }

  }


  // =====================================================
  // VERIFY OTP
  // =====================================================

  async function verifyOTP() {

    const email =
      document.getElementById("email").value.trim();

    const otp =
      document.getElementById("otp").value.trim();

    const verifyButton =
      document.getElementById("verifyButton");


    // Validation
    if (!otp) {

      showMessage(
        "Please enter the OTP.",
        "error"
      );

      return;
    }


    if (!requestId) {

      showMessage(
        "Please request an OTP first.",
        "error"
      );

      return;
    }


    verifyButton.disabled = true;
    verifyButton.textContent = "Verifying...";


    try {

      const response = await fetch(
        API_BASE + "/auth/otp/verify",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "X-API-Key": API_KEY
          },

          body: JSON.stringify({
            identifier: email,
            purpose: PURPOSE,
            request_id: requestId,
            otp: otp
          })
        }
      );


      const data = await response.json();


      if (data.success && data.verified) {

        showMessage(
          "✓ OTP verified successfully!",
          "success"
        );


        document.getElementById("otp").disabled = true;

        verifyButton.textContent = "Verified";

      } else {

        showMessage(
          data.message || "Invalid OTP.",
          "error"
        );

      }


    } catch (error) {

      console.error(error);

      showMessage(
        "Unable to connect to the OTP server.",
        "error"
      );

    } finally {

      if (!document.getElementById("otp").disabled) {
        verifyButton.disabled = false;
        verifyButton.textContent = "Verify OTP";
      }

    }

  }

</script>

</body>
</html>
